# vrnetlab test matrix: Extreme VOSS
# 4 nodes per version:
#   *-base   no passthrough, no startup-config
#   *-pt     passthrough,    no startup-config
#   *-cfg    no passthrough, startup-config
#   *-ptcfg  passthrough,    startup-config
# Each version is its own 4-node ring (eth1 -> next node's eth2).
# Comment out a version (nodes + links) to skip it.

name: vrt-voss

topology:
  defaults:
    kind: linux # no native VOSS kind in containerlab

  groups:
    base:
      env:
        CLAB_MGMT_PASSTHROUGH: "false"
    pt:
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
    cfg:
      env:
        CLAB_MGMT_PASSTHROUGH: "false"
      binds:
        - configs/voss-test.cfg:/config/startup-config.xsf
    ptcfg:
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
      binds:
        - configs/voss-test.cfg:/config/startup-config.xsf

  nodes:
    # --- 8.10.1.0 ---
    v810-base:  { group: base,  image: vrnetlab/extreme_voss:8.10.1.0 }
    v810-pt:    { group: pt,    image: vrnetlab/extreme_voss:8.10.1.0 }
    v810-cfg:   { group: cfg,   image: vrnetlab/extreme_voss:8.10.1.0 }
    v810-ptcfg: { group: ptcfg, image: vrnetlab/extreme_voss:8.10.1.0 }
    # --- 9.3.1.0 ---
    v931-base:  { group: base,  image: vrnetlab/extreme_voss:9.3.1.0 }
    v931-pt:    { group: pt,    image: vrnetlab/extreme_voss:9.3.1.0 }
    v931-cfg:   { group: cfg,   image: vrnetlab/extreme_voss:9.3.1.0 }
    v931-ptcfg: { group: ptcfg, image: vrnetlab/extreme_voss:9.3.1.0 }
    # --- 9.4.0.0 ---
    v940-base:  { group: base,  image: vrnetlab/extreme_voss:9.4.0.0 }
    v940-pt:    { group: pt,    image: vrnetlab/extreme_voss:9.4.0.0 }
    v940-cfg:   { group: cfg,   image: vrnetlab/extreme_voss:9.4.0.0 }
    v940-ptcfg: { group: ptcfg, image: vrnetlab/extreme_voss:9.4.0.0 }

  links:
    # --- 8.10.1.0 ring ---
    - endpoints: ["v810-base:eth1",  "v810-pt:eth2"]
    - endpoints: ["v810-pt:eth1",    "v810-cfg:eth2"]
    - endpoints: ["v810-cfg:eth1",   "v810-ptcfg:eth2"]
    - endpoints: ["v810-ptcfg:eth1", "v810-base:eth2"]
    # --- 9.3.1.0 ring ---
    - endpoints: ["v931-base:eth1",  "v931-pt:eth2"]
    - endpoints: ["v931-pt:eth1",    "v931-cfg:eth2"]
    - endpoints: ["v931-cfg:eth1",   "v931-ptcfg:eth2"]
    - endpoints: ["v931-ptcfg:eth1", "v931-base:eth2"]
    # --- 9.4.0.0 ring ---
    - endpoints: ["v940-base:eth1",  "v940-pt:eth2"]
    - endpoints: ["v940-pt:eth1",    "v940-cfg:eth2"]
    - endpoints: ["v940-cfg:eth1",   "v940-ptcfg:eth2"]
    - endpoints: ["v940-ptcfg:eth1", "v940-base:eth2"]
